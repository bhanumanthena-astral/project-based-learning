<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="bookGrad1" x1="8" y1="8" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="bookGrad2" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="bookShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#7c3aed" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Book back cover -->
  <rect x="8" y="8" width="32" height="32" rx="4" fill="url(#bookGrad1)" filter="url(#bookShadow)"/>
  <!-- Book pages -->
  <rect x="12" y="12" width="24" height="28" rx="2" fill="url(#bookGrad2)" opacity="0.6"/>
  <!-- Book spine -->
  <rect x="22" y="8" width="4" height="32" fill="url(#bookGrad1)" opacity="0.8"/>
</svg>
